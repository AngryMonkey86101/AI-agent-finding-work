<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Агент поиска работы{% endblock %}</title>
{% block head %}{% endblock %}
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #667085; --border: #d9dde5;
    --accent: #2f6fed; --accent-text: #fff; --ok-bg: #e7f6ec; --ok: #1e7a3c; --err: #c4320a; --err-bg: #fdeee8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --card: #1b2029; --text: #e6e8ec; --muted: #9aa3b2; --border: #2e3542;
      --accent: #5b8ff5; --accent-text: #0d1117; --ok-bg: #13301e; --ok: #6fd193; --err: #ff8a65; --err-bg: #3a1d14;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  section { background: var(--card); border: 1px solid var(--border); border-radius: 12px;
            padding: 20px; margin-bottom: 16px; }
  h2 { font-size: 17px; margin: 0 0 16px; }
  .field { margin-bottom: 16px; }
  .field:last-child { margin-bottom: 0; }
  label.title { display: block; font-weight: 600; margin-bottom: 6px; }
  input[type=text], input[type=number], input[type=time], input[type=password], select, textarea {
    width: 100%; padding: 9px 11px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--bg); color: var(--text); font: inherit; }
  textarea { min-height: 84px; resize: vertical; }
  .help { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .error { color: var(--err); font-size: 13px; margin-top: 4px; }
  .has-error input, .has-error textarea, .has-error select { border-color: var(--err); }
  .checks { display: flex; flex-wrap: wrap; gap: 8px 18px; }
  .checks label, .inline { display: inline-flex; align-items: center; gap: 6px; }
  .saved { font-size: 13px; color: var(--ok); margin-bottom: 6px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
  @media (max-width: 560px) { .row { grid-template-columns: 1fr; } }
  button { background: var(--accent); color: var(--accent-text); border: 0; border-radius: 8px;
           padding: 11px 20px; font: inherit; font-weight: 600; cursor: pointer; }
  .notice { background: var(--ok-bg); color: var(--ok); padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; }
  .alert { background: var(--err-bg); color: var(--err); padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; }
  .sticky { position: sticky; bottom: 0; padding: 12px 0; background: linear-gradient(transparent, var(--bg) 40%); }
  details summary { cursor: pointer; color: var(--accent); margin-top: 10px; }
  .nav { margin-bottom: 16px; color: var(--muted); }
  .nav a { color: var(--accent); }
  pre { white-space: pre-wrap; background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
        padding: 12px; max-height: 320px; overflow: auto; font-size: 13px; }
  table { width: 100%; border-collapse: collapse; }
  .vac { border-top: 1px solid var(--border); padding: 14px 0; }
  .vac:first-child { border-top: 0; padding-top: 0; }
  .vac h3 { font-size: 16px; margin: 0 0 2px; }
  .vac h3 a { color: var(--text); }
  .meta { color: var(--muted); font-size: 13px; }
  .badge { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 99px;
           border: 1px solid var(--border); color: var(--muted); margin-right: 6px; }
  .badge.ready { border-color: var(--ok); color: var(--ok); }
  .badge.error { border-color: var(--err); color: var(--err); }
  .filters { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-bottom: 12px; font-size: 14px; }
  .filters a { color: var(--accent); }
  .filters a.active { color: var(--text); font-weight: 600; text-decoration: none; }
  .health { display: grid; gap: 6px; }
  .hrow { display: flex; gap: 10px; align-items: baseline; }
  .hrow .ok { color: var(--ok); font-weight: 700; }
  .hrow .bad { color: var(--err); font-weight: 700; }
  .help + .help, .alert + .alert, .help + .alert, .alert + .help { margin-top: 6px; }
  .alert { margin-bottom: 0; }
</style>
</head>
<body>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
